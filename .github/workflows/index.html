<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengaturan – Umum</title>
<style>
  :root { --bg:#000; --card:#1c1c1e; --line:#38383a; --label:#fff; --muted:#8e8e93; --blue:#0a84ff; --dur:.34s; }
  * { -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
  #app { position:relative; max-width:480px; height:100%; margin:0 auto; overflow:hidden; background:#000; }

  .page { --bar-h:calc(64px + env(safe-area-inset-top,0px)); position:absolute; inset:0; overflow:hidden; background:#000;
    transform:translateX(100%); visibility:hidden; touch-action:pan-y; will-change:transform;
    transition:transform var(--dur) cubic-bezier(.32,.72,0,1), visibility 0s linear var(--dur); }
  .page.active  { transform:none; visibility:visible; transition-delay:0s; }
  .page.behind  { transform:translateX(-28%); visibility:visible; transition-delay:0s; pointer-events:none; }
  .page.deep    { transform:translateX(-28%); }
  .page.dragging{ visibility:visible; transition:none; }
  .scroll > .content { min-height:calc(100% + 1px); }
  .page.sweep { border-radius:44px 0 0 44px; box-shadow:-10px 0 40px rgba(0,0,0,.6); }

  .note { color:var(--muted); font-size:15px; line-height:1.35; margin:-14px 16px 28px; }
  .note a { color:var(--blue); text-decoration:none; }

  .bar { position:absolute; top:0; left:0; right:0; z-index:50; height:var(--bar-h); box-sizing:border-box;
    display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top,0px) 16px 0;
    background:none; pointer-events:none; }
  .bar .back { pointer-events:auto; }
  .scroll { position:absolute; inset:0; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;
    padding:calc(var(--bar-h) + 24px) 16px calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-mask-image:linear-gradient(to bottom, transparent calc(var(--bar-h) - 28px), black calc(var(--bar-h) + 20px));
    mask-image:linear-gradient(to bottom, transparent calc(var(--bar-h) - 28px), black calc(var(--bar-h) + 20px)); }
  .bar h1 { font-size:17px; font-weight:600; margin:0; max-width:calc(100% - 120px); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar.left { justify-content:flex-start; padding-right:0; }
  .bar.left h1 { margin-left:57px; max-width:none; overflow:visible; text-overflow:clip; text-align:left; letter-spacing:-.2px; }
  .back { position:absolute; left:16px; top:calc(10px + env(safe-area-inset-top,0px)); width:44px; height:44px; border-radius:50%;
    z-index:2; display:grid; place-items:center; background:#1c1c1e; border:1px solid rgba(255,255,255,.12);
    color:#f2f2f7; cursor:pointer; padding:0; outline:none; touch-action:manipulation; transition:opacity .2s ease; }
  .back:focus, .back:focus-visible { outline:none; box-shadow:none; }
  .back:active, .back.pressed { opacity:.5; transition:none; }
  .row:focus-visible { outline:2px solid var(--blue); outline-offset:-2px; }

  .card { background:var(--card); border-radius:26px; margin-bottom:28px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; align-items:center; width:100%; min-height:52px; padding:0 16px; gap:14px; text-align:left;
    background:none; border:0; color:inherit; font:inherit; font-size:17px; cursor:default; position:relative; box-sizing:border-box; }
  .row.nav { cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition:background-color .25s ease; }
  .row.nav:active, .row.nav.pressed { background-color:rgba(255,255,255,.1); transition:none; }
  .row + .row::before { content:""; position:absolute; top:0; right:0; height:1px; background:var(--line); left:16px; }
  .row.has-icon { padding:0 14px; }
  .row.has-icon + .row.has-icon::before { left:56px; }

  /* ---------- Ikon: kotak gelap + ikon milikmu ---------- */
  .ico { flex:none; width:28px; height:28px; border-radius:7px; display:grid; place-items:center; box-sizing:border-box;
    background:linear-gradient(160deg,#2f2f31,#161617); border:1px solid rgba(255,255,255,.14); box-shadow:inset 0 1px 0 rgba(255,255,255,.07); }
  .ico img { display:block; width:18px; height:18px; object-fit:contain; }
  .head-card .big img { width:40px; height:40px; }

  .val { margin-left:auto; color:var(--muted); font-size:17px; text-align:right; white-space:nowrap; }
  @media (max-width:380px) { .row { gap:8px; } .val { font-size:16px; } }
  @media (max-width:340px) { .row { font-size:15px; padding:0 12px; } .val { font-size:14px; } }
  .chev { flex:none; width:8px; height:14px; color:#636366; margin-left:2px; }
  .lbl { white-space:nowrap; }
  .link { color:var(--blue); }
  .head-card { padding:20px 20px 22px; }
  .head-card .big { width:60px; height:60px; border-radius:16px; }
  .sec { color:var(--muted); font-size:15px; font-weight:600; margin:0 0 8px 16px; }
  @media (min-width:700px) { body { background:#0b0b0c; } #app { height:min(100%,900px); margin-top:max(0px,calc((100% - 900px)/2)); border-radius:28px; box-shadow:0 0 0 1px #222; } }
  @media (prefers-reduced-motion:reduce) { .page { transition:none; } }
</style>
</head>

    <div class="scroll"><div id="vpnmgmt-list" class="content"></div></div>

    <div class="scroll"><div id="vpn-list" class="content"></div></div>

    <div class="scroll"><div id="cert-list" class="content"></div></div>

</div>
